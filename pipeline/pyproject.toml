[project]
name = "carrera-pipeline"
version = "0.1.0"
description = "Daily junior/internship postings collector for carrera-web (official APIs only)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.setuptools.package-data]
pipeline = ["*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
