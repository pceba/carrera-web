# Keyword rules. Matching is case/accent-insensitive on whole words (phrases allowed).
# Level and industry are decided from the TITLE (plus department and employment type), never
# from a full description: it keeps the output auditable.

# Order = priority: the first level that matches wins.
levels:
  intern:
    [
      intern,
      internship,
      becario,
      becaria,
      beca,
      practicas,
      practicante,
      "working student",
      werkstudent,
      stagiaire,
    ]
  trainee:
    [
      trainee,
      "management trainee",
      "graduate programme",
      "graduate program",
      "graduate scheme",
      "programa de graduados",
      "programa de talento joven",
    ]
  graduate:
    [
      graduate,
      "new grad",
      "recien graduado",
      "recien titulado",
      "early careers",
      "early career",
      "entry level",
      "entry-level",
    ]
  junior: [junior, jr, "junior level", "nivel junior", "sin experiencia"]
  analyst: [analyst, analista, associate analyst]

# A title with any of these is not junior, even if a junior word also appears ("Senior Analyst").
exclude:
  [
    senior,
    sr,
    lead,
    principal,
    staff,
    manager,
    director,
    head,
    vp,
    "vice president",
    architect,
    "team lead",
    responsable,
    gerente,
    jefe,
    experienced,
  ]

