name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Playwright smoke
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  # Rust engine (crates/): formatting, lints, tests. `cargo test` also regenerates the TypeScript
  # types of cw-domain into src/lib/generated, so the last step fails if the committed copies are stale.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/lib/generated)" ]; then
            echo "::error::src/lib/generated is stale. Run 'cargo test' and commit the result."
            git status --porcelain -- src/lib/generated
            git diff -- src/lib/generated
            exit 1
          fi
