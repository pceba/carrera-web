name: postings

# Daily collection of junior postings into Supabase. Needs the repository secrets
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (Adzuna keys are optional). Without them the job
# skips cleanly instead of failing.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write JSON only, no database"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e ".[dev]"
      - name: Test and lint
        working-directory: pipeline
        run: |
          ruff check .
          pytest -q
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set: skipping the database write."
          fi
      - name: Collect and sync
        if: steps.secrets.outputs.present == 'true' && inputs.dry_run != true
        working-directory: pipeline
        run: python -m pipeline run
      - name: Dry run
        if: steps.secrets.outputs.present != 'true' || inputs.dry_run == true
        working-directory: pipeline
        run: python -m pipeline run --dry-run
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.present != 'true' || inputs.dry_run == true
        with:
          name: postings-dry-run
          path: pipeline/out/
          retention-days: 7
