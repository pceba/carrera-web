name: postings

# Daily collection of junior postings into Supabase, with the Rust engine (crates/cw-pipeline).
# Needs the repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (Adzuna keys are
# optional). Without them the job skips the database write cleanly and uploads the dry-run JSON.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write JSON only, no database"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked -p cw-pipeline
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set: skipping the database write."
          fi
      - name: Collect and sync
        if: steps.secrets.outputs.present == 'true' && inputs.dry_run != true
        run: ./target/release/cw-pipeline run
      - name: Dry run
        if: steps.secrets.outputs.present != 'true' || inputs.dry_run == true
        run: ./target/release/cw-pipeline run --dry-run
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.present != 'true' || inputs.dry_run == true
        with:
          name: postings-dry-run
          path: out/
          retention-days: 7
      # A daily run that could not write to the database must not look green: that is how
      # /ofertas stayed empty unnoticed. Manual dry runs stay green.
      - name: Fail loudly when a scheduled run had no secrets
        if: github.event_name == 'schedule' && steps.secrets.outputs.present != 'true'
        run: |
          echo "::error::Scheduled run had no SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY: nothing was written and /ofertas stays empty. Add the repository secrets (Settings > Secrets and variables > Actions)."
          exit 1
