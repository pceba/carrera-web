# Minimal local config for `supabase start`. The hosted project is configured in the dashboard.
project_id = "path"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
