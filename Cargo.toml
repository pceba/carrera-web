[workspace]
resolver = "3"
members = ["crates/cw-domain", "crates/cw-sources", "crates/cw-classify", "crates/cw-pipeline"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pceba/carrera-web"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
