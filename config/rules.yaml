# Industry by keyword on company + title + department. First match wins, so the order below is a
# priority: specific industries first, the broad "consulting" bucket last. A posting that matches
# none of the six is DROPPED (there is no "other"). Company names are keywords too, because most
# junior titles ("Analyst", "Associate") say nothing about the industry by themselves.
# Keep phrases specific: a bare word like "legal" or "data" would pull in unrelated roles.
industries:
  # Big law = law FIRMS. Generic "legal analyst/intern" titles are left out on purpose: they are
  # mostly in-house roles at companies (a fintech's legal team is not a law firm). Those are only
  # kept when the firm name matches.
  big-law:
    [
      lawyer,
      abogado,
      abogada,
      paralegal,
      solicitor,
      attorney,
      "law firm",
      despacho,
