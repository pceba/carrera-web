# Dictionaries used by the browser engine: `cw-cv` finds these in a CV, `cw-match` uses
# `skills[].industries` to explain why a skill helps in a posting's industry.
# Matching is case/accent-insensitive on whole words (see cw-classify::contains_word), except
# entries marked `exact: true`, which must appear with this exact case (short names like "R").
# Names and aliases are plain text; everything here is auditable by reading this file.

skills:
  # --- Data science and AI ---------------------------------------------------------------------
  - { name: SQL, industries: [data-science, ai, consulting, investment-banking] }
  - { name: Python, industries: [data-science, ai, consulting, investment-banking] }
  - { name: R, exact: true, industries: [data-science] }
  - { name: Pandas, industries: [data-science, ai] }
  - { name: NumPy, industries: [data-science, ai] }
  - { name: Scikit-learn, aliases: [sklearn, scikit learn], industries: [data-science, ai] }
  - { name: PyTorch, industries: [ai, data-science] }
  - { name: TensorFlow, industries: [ai, data-science] }
  - { name: Spark, aliases: [pyspark, "apache spark"], industries: [data-science, ai] }
  - { name: Machine learning, aliases: [aprendizaje automatico, "ml"], industries: [ai, data-science] }
  - { name: Deep learning, aliases: [aprendizaje profundo], industries: [ai, data-science] }
  - { name: NLP, aliases: ["procesamiento del lenguaje natural", "natural language processing"], industries: [ai, data-science] }
  - { name: LLM, aliases: [llms, "large language models", "modelos de lenguaje"], industries: [ai] }
  - { name: Prompt engineering, industries: [ai] }
  - { name: RAG, exact: true, industries: [ai] }
  - { name: Estadística, aliases: [statistics, estadistica], industries: [data-science, ai, consulting] }
  - { name: Econometría, aliases: [econometrics, econometria], industries: [data-science, consulting] }
  - { name: A/B testing, aliases: ["ab testing", "a/b tests", "experimentacion"], industries: [data-science] }
  - { name: ETL, industries: [data-science] }
  - { name: dbt, exact: true, industries: [data-science] }
  - { name: Airflow, industries: [data-science, ai] }
  - { name: Power BI, aliases: [powerbi], industries: [data-science, consulting] }
  - { name: Tableau, industries: [data-science, consulting] }
  - { name: Looker, industries: [data-science] }
  - { name: Docker, industries: [ai, data-science] }
  - { name: Git, aliases: [github, gitlab], industries: [ai, data-science] }
  - { name: AWS, industries: [ai, data-science] }
  - { name: Azure, industries: [ai, data-science, consulting] }
  - { name: GCP, aliases: ["google cloud"], industries: [ai, data-science] }
  - { name: MATLAB, industries: [data-science, ai] }
  - { name: Stata, industries: [data-science, consulting] }
  - { name: SAS, exact: true, industries: [data-science] }
  - { name: Visualización de datos, aliases: ["data visualization", "visualizacion de datos"], industries: [data-science, consulting] }

  # --- Finance: investment banking and private equity ----------------------------------------------
