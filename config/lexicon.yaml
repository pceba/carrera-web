  - { name: Análisis financiero, aliases: ["financial analysis", "analisis financiero", "estados financieros", "financial statements"], industries: [investment-banking, private-equity, consulting] }
  - { name: Contabilidad, aliases: [accounting, "contabilidad financiera"], industries: [investment-banking, private-equity, consulting] }
