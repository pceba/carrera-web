  - { name: Modelización financiera, aliases: ["financial modelling", "financial modeling", "modelizacion financiera", "modelado financiero"], industries: [investment-banking, private-equity, consulting] }
  - { name: Valoración de empresas, aliases: [valoracion, valuation, dcf, "discounted cash flow", "flujos de caja descontados", "valoracion de empresas"], industries: [investment-banking, private-equity] }
