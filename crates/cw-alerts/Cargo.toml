[package]
name = "cw-alerts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive"] }
cw-domain = { version = "0.1.0", path = "../cw-domain" }
cw-lexicon = { version = "0.1.0", path = "../cw-lexicon" }
cw-match = { version = "0.1.0", path = "../cw-match" }
cw-sources = { version = "0.1.0", path = "../cw-sources" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6.5"
