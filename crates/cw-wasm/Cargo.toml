[package]
name = "cw-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# cdylib is what wasm-bindgen turns into the .wasm file; rlib lets `cargo test` link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
cw-cv = { version = "0.1.0", path = "../cw-cv" }
cw-domain = { version = "0.1.0", path = "../cw-domain" }
cw-lexicon = { version = "0.1.0", path = "../cw-lexicon" }
cw-match = { version = "0.1.0", path = "../cw-match" }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
